name: Workflow CI - Heart Failure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    name: Train Model & Push Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      # 3. Cek environment
      - name: Check Env
        run: |
          python --version
          pip --version

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          pip install mlflow==3.12.0 scikit-learn pandas numpy

      # 5. Run MLflow project
      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/Cheesecake222/Eksperimen_SML_Dinda-Krisnauli-Pakpahan.mlflow
        run: |
          cd MLProject
          python modelling.py

      # 6. Get latest MLflow run_id dan download artefak
      - name: Get latest MLflow run_id
        env:
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/Cheesecake222/Eksperimen_SML_Dinda-Krisnauli-Pakpahan.mlflow
        run: |
          python - <<'PYEOF'
          import mlflow, os
          mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name('heart-failure-ci')
          runs = client.search_runs(exp.experiment_id, order_by=['start_time DESC'], max_results=1)
          run_id = runs[0].info.run_id
          print(f"RUN_ID: {run_id}")

          # Download artefak model ke lokal
          local_path = client.download_artifacts(run_id, "model", "./downloaded_model")
          print(f"Model downloaded to: {local_path}")

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"RUN_ID={run_id}\n")
              f.write(f"MODEL_PATH={local_path}\n")
          PYEOF

      # 7. Install Python dependencies
      - name: Install Python dependencies
        run: pip install mlflow==3.12.0

      # 8. Upload artefak ke GitHub
      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: MLProject/
          retention-days: 30

      # 9. Build Docker image dari path lokal
      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            --model-uri ${{ env.MODEL_PATH }} \
            --name dindae/heart-failure-prediction \
            --env-manager local

      # 10. Login ke Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 11. Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag dindae/heart-failure-prediction:latest \
            dindae/heart-failure-prediction:${{ github.run_number }}

      # 12. Push Docker image
      - name: Push Docker Image
        run: |
          docker push dindae/heart-failure-prediction:latest
          docker push dindae/heart-failure-prediction:${{ github.run_number }}

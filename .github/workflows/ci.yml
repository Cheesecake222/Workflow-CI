name: Workflow CI - Heart Failure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    name: Train Model & Push Docker
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/1/*/ 2>/dev/null | head -n 1 | cut -d'/' -f3)
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          fi
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: mlruns/
          retention-days: 30

      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name dindae/heart-failure-prediction \
            --env-manager local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag dindae/heart-failure-prediction:latest \
            dindae/heart-failure-prediction:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push dindae/heart-failure-prediction:latest
          docker push dindae/heart-failure-prediction:${{ github.run_number }}

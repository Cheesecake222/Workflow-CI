name: Workflow CI - Heart Failure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    name: Train Model & Push Docker
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          echo "=== Struktur mlruns ==="
          find . -type d -name "mlruns" 2>/dev/null
          find . -path "*/mlruns/*/*" -name "meta.yaml" 2>/dev/null | head -5

          RUN_ID=$(find . -path "*/mlruns/*/*/meta.yaml" 2>/dev/null \
            | xargs grep -l "run_id" 2>/dev/null \
            | head -n 1 \
            | awk -F'/' '{print $(NF-1)}')

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Upload Artifact to GitHub
        run: |
          mkdir -p saved_model
          MODEL_PATH=$(find . -type d -name "model" | grep mlruns | head -n 1)
          if [ -n "$MODEL_PATH" ]; then
            cp -r "$MODEL_PATH" saved_model/
            echo "Model copied from: $MODEL_PATH"
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add saved_model/
          git commit -m "CI: Save model artifact [run #${{ github.run_number }}]" || echo "Nothing to commit"
          git push

      - name: Build Docker Model
        run: |
          echo "Building docker with RUN_ID: ${{ env.RUN_ID }}"
          mlflow models build-docker \
            --model-uri "runs:/${{ env.RUN_ID }}/model" \
            --name dindae/heart-failure-prediction \
            --env-manager local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: |
          docker tag dindae/heart-failure-prediction:latest \
            dindae/heart-failure-prediction:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push dindae/heart-failure-prediction:latest
          docker push dindae/heart-failure-prediction:${{ github.run_number }}
